{% extends "base.html" %}
{% block title %}Edit Profile — VulnPy{% endblock %}

{% block content %}
<div class="wrapper">
    <div class="form-card">
        <h2>Edit Profile — {{ user.username }}</h2>
        <form method="POST">
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="5" placeholder="Tell us about yourself…">{{ user.bio }}</textarea>
            </div>
            <div class="form-footer">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('profile.view_profile', username=user.username) }}" class="link">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
